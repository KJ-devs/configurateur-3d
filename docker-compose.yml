services:
  db:
    image: postgres:16-alpine
    container_name: configurator-db
    environment:
      POSTGRES_DB: configurator
      POSTGRES_USER: configurator
      POSTGRES_PASSWORD: configurator
    ports:
      - "5434:5432"
    volumes:
      - configurator-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U configurator"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  configurator-db:
